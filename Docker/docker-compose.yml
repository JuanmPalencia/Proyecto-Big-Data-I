# docker-compose.yml
# Ejecuta:
# docker-compose --profile etl --profile db up --build

x-common-env: &common-env
  env_file:
    - .env

services:
  etl:
    build: .
    container_name: proyecto-big-data-etl
    mem_limit: 12g
    cpus: 4
    <<: *common-env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      INVESTEU_BASE_SLEEP: 300
      INVESTEU_429_PENALTIES: 300,600,1200
      INVESTEU_TIMEOUT: 90
      INVESTEU_MAX_RETRIES: 3

      # ✅ Postgres (docker local) para que tu ETL escriba a SQL
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    profiles: [etl]

  postgres:
    image: postgres:16
    container_name: proyecto-big-data-postgres
    <<: *common-env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    profiles: [db]

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: proyecto-big-data-pgadmin
    <<: *common-env
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    depends_on:
      - postgres
    restart: unless-stopped
    profiles: [db]
